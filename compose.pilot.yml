name: radpad-dukecam-pilot
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: radpad
      POSTGRES_DB: radpad_pilot
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pilot_db:/var/lib/postgresql/data
    networks: [pilot]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U radpad -d radpad_pilot"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    cpus: 1
    logging:
      options: {max-size: 10m, max-file: "3"}
  app:
    image: radpad-dukecam-pilot:${PILOT_REVISION:-local}
    build: .
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      RADPAD_ORIGIN: https://ubuntu5.tailfe58d2.ts.net:4011
      RADPAD_ADMINS: dan@ir-ga.com
      RADPAD_SOCKET_PATH: /run/dukecam/dukecam.sock
      STORAGE_PATH: /data/photos
      THUMB_PATH: /data/thumbs
      BASE_URL: https://ubuntu5.tailfe58d2.ts.net:4011
      MAX_UPLOAD_MB: "25"
      PROPERTYOS_URL: ""
      FYXT_API_KEY: ""
    secrets:
      - database_url
    volumes:
      - ../data:/data
      - ../run:/run/dukecam
    networks: [pilot]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    stop_grace_period: 45s
    logging:
      options: {max-size: 10m, max-file: "3"}
networks:
  pilot:
    internal: true
volumes:
  pilot_db:
secrets:
  db_password:
    file: ../secrets/db-password
  database_url:
    file: ../secrets/database-url
